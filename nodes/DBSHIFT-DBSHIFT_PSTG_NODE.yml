operation:
  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: |-
      MERGE INTO Alliant_DW_Stage.dbo.dw_client_benchmarking_client_program_staging AS TGT
      USING (
          SELECT
              stg_src.dw_client_benchmarking_client_program_staging_id, -- NOTE: Assumed Primary Key for the join
              cbc.dw_client_benchmarking_client_id,
              pt.client_benchmarking_program_type_id,
              cp.dw_company_id AS dw_company_id_primary,
              ca.dw_company_id AS dw_company_id_aggregate,
              stg_src.source_system_primary_limit,
              stg_src.source_system_primary_premium,
              stg_src.source_system_primary_sir_retention,
              stg_src.source_system_aggregate_limit,
              stg_src.source_system_aggregate_premium,
              stg_src.source_system_aggregate_sir_retention
          FROM Alliant_DW_Stage.dbo.dw_client_benchmarking_client_program_staging stg_src
          LEFT JOIN Alliant_DW.dbo.dw_client_benchmarking_client cbc ON stg_src.source_system_policy_line_id = cbc.source_system_policy_line_id
          LEFT JOIN Alliant_DW.ref.client_benchmarking_program_type pt ON stg_src.program_type_key = pt.program_type_key
          LEFT JOIN Alliant_DW.dbo.dw_company cp ON stg_src.primary_company_lookup_code = cp.company_lookupcode
          LEFT JOIN Alliant_DW.dbo.dw_company ca ON stg_src.aggregate_company_lookup_code = ca.company_lookupcode
      ) AS SRC
      ON TGT.dw_client_benchmarking_client_program_staging_id = SRC.dw_client_benchmarking_client_program_staging_id
      WHEN MATCHED THEN
      UPDATE SET
          TGT.dw_client_benchmarking_client_id = IFNULL(SRC.dw_client_benchmarking_client_id, -1),
          TGT.client_benchmarking_program_type_id = IFNULL(SRC.client_benchmarking_program_type_id, -1),
          TGT.dw_company_id_primary = IFNULL(SRC.dw_company_id_primary, -1),
          TGT.dw_company_id_aggregate = IFNULL(SRC.dw_company_id_aggregate, -1),
          TGT.primary_limit = NULLIF(TRY_CAST(REPLACE(REPLACE(SRC.source_system_primary_limit, '$', ''), ',', '') AS NUMERIC(38,0)),0),
          TGT.primary_premium = NULLIF(TRY_CAST(REPLACE(REPLACE(SRC.source_system_primary_premium, '$', ''), ',', '') AS NUMERIC(38,0)),0),
          TGT.primary_sir_retention = NULLIF(TRY_CAST(REPLACE(REPLACE(SRC.source_system_primary_sir_retention, '$', ''), ',', '') AS NUMERIC(38,0)),0),
          TGT.aggregate_limit = NULLIF(TRY_CAST(REPLACE(REPLACE(SRC.source_system_aggregate_limit, '$', ''), ',', '') AS NUMERIC(38,0)),0),
          TGT.aggregate_premium = NULLIF(TRY_CAST(REPLACE(REPLACE(SRC.source_system_aggregate_premium, '$', ''), ',', '') AS NUMERIC(38,0)),0),
          TGT.aggregate_sir_retention = NULLIF(TRY_CAST(REPLACE(REPLACE(SRC.source_system_aggregate_sir_retention, '$', ''), ',', '') AS NUMERIC(38,0)),0);
    testsEnabled: true
    truncateBefore: false
